name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Evaluate the built package as a real Node module (publint + attw +
      # a bare Node import) — bundlers hide unspecified-ESM packaging bugs.
      - run: npm run check:package
